name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"
          cache: 'pip' # Caches dependencies to speed up future builds

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download and extract OpenSSL
        # Simplified logic to ensure openssl.exe is in the 'openssl' directory
        run: |
          curl -L "https://downloads.sourceforge.net/project/openssl-for-windows/OpenSSL-1.1.1h_win32%28static%29%5BNo-GOST%5D.zip" -o openssl.zip
          powershell Expand-Archive openssl.zip -DestinationPath openssl_temp
          mkdir openssl
          dir -r openssl_temp/openssl.exe | copy-item -Destination openssl/openssl.exe

      - name: Build executable
        run: python build.py

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          # Directly reference the generated file
          files: dist/Hi10-DL.exe
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}